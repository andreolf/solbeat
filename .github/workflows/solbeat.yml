name: solbeat refresh

on:
  schedule:
    # GitHub throttles schedules on quiet repos (multi-hour delays observed).
    # Over-schedule at off-peak minutes so the EFFECTIVE cadence lands near
    # the 30-minute target even under 2-3x throttling. Runs are ~40s and free.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: solbeat-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Collect and render
        env:
          # Optional Dune extractor: add these as repo secrets to enable it.
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID: ${{ vars.DUNE_QUERY_ID }}
        run: python3 solbeat.py run

      - name: Refresh dashboard screenshot
        # Runners ship Chrome; a stale/missing browser must never break the loop.
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --headless --disable-gpu --no-sandbox \
              --virtual-time-budget=2500 --hide-scrollbars \
              --window-size=1240,720 \
              --screenshot="$PWD/docs/screenshot.png" \
              "file://$PWD/docs/index.html" || true
          fi

      - name: Commit refreshed report
        run: |
          git config user.name "solbeat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "solbeat: refresh $(date -u +%FT%TZ)"
          # docs/ is fully regenerated each run: on a race, keep our version.
          git push || {
            git fetch origin main
            git rebase -X theirs origin/main
            git push
          }
