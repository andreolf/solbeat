name: solbeat refresh

on:
  schedule:
    # GitHub's scheduler heavily throttles quiet repos (observed: it honors a
    # slot only every 2-5 hours regardless of how many are requested). So each
    # honored run becomes a KEEP-ALIVE LOOP: it refreshes every 30 minutes for
    # ~5.5 hours, and the scheduler only needs to fire occasionally to hand
    # off the baton. Public-repo runner minutes are free.
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: solbeat-refresh
  # A newly honored schedule replaces the running loop seamlessly.
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Refresh loop (every 30 min while alive)
        env:
          # Optional extractors: add as repo secrets/vars to enable.
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_QUERY_ID: ${{ vars.DUNE_QUERY_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_HANDLES: ${{ vars.X_HANDLES }}
        run: |
          set +e
          git config user.name "solbeat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          END=$(( SECONDS + 19200 ))   # ~5h20m of looping, under the 350m timeout
          while :; do
            python3 solbeat.py run

            # Runners ship Chrome; a missing browser must never break the loop.
            if command -v google-chrome >/dev/null 2>&1; then
              google-chrome --headless --disable-gpu --no-sandbox \
                --virtual-time-budget=2500 --hide-scrollbars \
                --window-size=1240,720 \
                --screenshot="$PWD/docs/screenshot.png" \
                "file://$PWD/docs/index.html" || true
            fi

            git add docs
            if ! git diff --cached --quiet; then
              git commit -m "solbeat: refresh $(date -u +%FT%TZ)"
              # docs/ is fully regenerated each run: on a race, keep our version.
              git push || {
                git fetch origin main
                git rebase -X theirs origin/main
                git push
              }
            fi

            [ $SECONDS -ge $END ] && break
            sleep 1800
          done
          true
